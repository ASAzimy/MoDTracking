[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modtracking"
version = "0.1.0"
description = "Vision-based pure object tracking and autonomous following scaffold for UAVs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MoDTracking contributors" }
]

[tool.setuptools.packages.find]
where = ["src"]
